<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piper Oren</title>
  <meta name="description" content="Public Sector Capacity Building and Evaluation. Incoming MSPPM, Carnegie Mellon University, Heinz College.">
  <style>
    :root {
      --bg: #faf9f6;
      --text: #1a1916;
      --muted: #7a7568;
      --accent: #3a2d5e;
      --border: #e2dfd6;
      --font: "Times New Roman", Times, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      max-width: 34rem;
      text-align: center;
    }

    .site-name {
      font-size: 1.75rem;
      font-weight: normal;
      color: var(--text);
      margin-bottom: 0.2rem;
    }

    .site-tagline {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
    }

    .rule {
      width: 3rem;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2rem;
    }

    .status {
      font-size: 0.97rem;
      color: #3a3830;
      font-style: italic;
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    .site-links {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .site-links a {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      font-style: italic;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .site-links a:hover,
    .site-links a:focus-visible { color: var(--accent); border-color: var(--accent); }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 700px) {
      body { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="site-name">Piper Oren</h1>
    <p class="site-tagline">Public Sector Capacity Building and Evaluation</p>
    <div class="rule"></div>
    <p class="status">This site is being revised.<br>A new version is on its way.</p>
    <div class="site-links">
      <a href="https://www.linkedin.com/in/piper-oren/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:piper.oren@gmail.com">piper.oren@gmail.com</a>
    </div>
  </main>
</body>
</html>
